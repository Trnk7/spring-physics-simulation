<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Simulation</title>
    <link href="style.css" rel = "stylesheet">
    <script src ="vector.js"></script>
    <script src = "point.js"></script>
    <script src="spring.js"></script>
</head>
<body>
    <div id="controls">
        <h2>Spring Controls</h2>


        <label for="gravityY">Gravity Y: <span id="gravityYVal">200</span></label>
        <input id="gravityY" type="range" min="-500" max="1000" step="10" value="200">

        <label for="stiffness">Stiffness: <span id="stiffnessVal">200</span></label>
        <input id="stiffness" type="range" min="20" max="500" step="10" value="200">

        <label for="dampingScale">Damping Scale: <span id="dampingScaleVal">1.0</span></label>
        <input id="dampingScale" type="range" min="0" max="2" step="0.1" value="1.0">

        <div class="control-row">
            <button id="pauseBtn" type="button">Pause</button>
            <button id="resetBtn" type="button">Reset Grid</button>
        </div>
    </div>
    <canvas id = "canvas"></canvas>
    <script src="main.js"></script>
</body>
</html>
